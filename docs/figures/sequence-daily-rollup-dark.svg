<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 960" width="1500" height="960" role="img" aria-label="Sequence of the daily rollup. A systemd timer starts the rollup job, which aggregates yesterday&#x27;s ClickHouse mcp_requests by server, tool, client and outcome and upserts Postgres analytics.mcp_daily and analytics.mcp_clients_monthly. The timer also starts the downloads collector, which fetches download and pull counts and registry entries from PyPI, npm, Docker Hub and the MCP Registry into analytics.mcp_downloads_daily. If a unit fails or hangs, OnFailure sends an ntfy push. cfde-atlas reads the Postgres tables at any time.">
<title>Sequence of the daily rollup. A systemd timer starts the rollup job, which aggregates yesterday&#x27;s ClickHouse mcp_requests by server, tool, client and outcome and upserts Postgres analytics.mcp_daily and analytics.mcp_clients_monthly. The timer also starts the downloads collector, which fetches download and pull counts and registry entries from PyPI, npm, Docker Hub and the MCP Registry into analytics.mcp_downloads_daily. If a unit fails or hangs, OnFailure sends an ntfy push. cfde-atlas reads the Postgres tables at any time.</title>
