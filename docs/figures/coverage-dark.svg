<text x="20" y="576" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#a9b8ca" font-weight="700" text-anchor="start" xml:space="preserve">LEGEND</text>
