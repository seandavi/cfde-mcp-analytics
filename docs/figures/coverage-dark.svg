<text x="667.5" y="576" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#e8eef6" font-weight="400" text-anchor="start" xml:space="preserve">Not visible to CFDE</text>
