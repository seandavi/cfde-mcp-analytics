<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 603" width="1340" height="603" role="img" aria-label="Coverage. Visible to CFDE: remote servers reached through the CFDE gateway URL, and stdio servers the gateway runs (optional). Not visible: the same remote servers reached through their original URLs (only the team&#x27;s own logs see them), local stdio installs (package downloads are a floor), and third-party wrappers such as the GTEx and Enrichr servers, which call DCC APIs directly and show up only as download counts.">
<title>Coverage. Visible to CFDE: remote servers reached through the CFDE gateway URL, and stdio servers the gateway runs (optional). Not visible: the same remote servers reached through their original URLs (only the team&#x27;s own logs see them), local stdio installs (package downloads are a floor), and third-party wrappers such as the GTEx and Enrichr servers, which call DCC APIs directly and show up only as download counts.</title>
<defs><marker id="ah-MUTED" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a9b8ca"/></marker><marker id="ah-BLUE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4aa8e8"/></marker><marker id="ah-GREEN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9fd05a"/></marker><marker id="ah-AMBER" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f2b441"/></marker><marker id="ah-CORAL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff7a66"/></marker><marker id="ah-VIOLET" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b49cff"/></marker></defs>
<text x="36" y="40" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#a9b8ca" font-weight="700" text-anchor="start" xml:space="preserve">How a user reaches the server</text>
<text x="420" y="40" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#a9b8ca" font-weight="700" text-anchor="start" xml:space="preserve">Example</text>
<text x="790" y="40" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#a9b8ca" font-weight="700" text-anchor="start" xml:space="preserve">What CFDE sees</text>
<text x="1110" y="40" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#a9b8ca" font-weight="700" text-anchor="start" xml:space="preserve">Verdict</text>
<rect x="20" y="85" width="1300" height="172" rx="16" fill="none" stroke="#4aa8e8" stroke-width="1.8" stroke-dasharray="5 6"/>
<text x="36" y="77" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#4aa8e8" font-weight="700" text-anchor="start" xml:space="preserve">THROUGH THE CFDE GATEWAY</text>
<rect x="20" y="283" width="1300" height="256" rx="16" fill="none" stroke="#ff7a66" stroke-width="1.8" stroke-dasharray="5 6"/>
<text x="36" y="275" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#ff7a66" font-weight="700" text-anchor="start" xml:space="preserve">OUTSIDE THE GATEWAY</text>
<rect x="30" y="93" width="1280" height="72" rx="10" fill="#4aa8e812" stroke="#4aa8e8" stroke-width="1.2"/>
<text x="46" y="136" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#e8eef6" font-weight="600" text-anchor="start" xml:space="preserve">Remote server via the CFDE URL</text>
<text x="420" y="135" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#a9b8ca" font-weight="400" text-anchor="start" xml:space="preserve">cfde-mcp.cancerdatasci.org/glygen/mcp</text>
<text x="790" y="124" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#e8eef6" font-weight="400" text-anchor="start" xml:space="preserve">every call: server, tool,</text>
<text x="790" y="147" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#e8eef6" font-weight="400" text-anchor="start" xml:space="preserve">client app, outcome</text>
<rect x="1110" y="116" width="80.75999999999999" height="26" rx="13.0" fill="#4aa8e822" stroke="#4aa8e8"/>
