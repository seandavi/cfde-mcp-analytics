<text x="420" y="219" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#a9b8ca" font-weight="400" text-anchor="start" xml:space="preserve">standards-explorer-mcp, run by CFDE</text>
<text x="790" y="208" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#e8eef6" font-weight="400" text-anchor="start" xml:space="preserve">every call, as above</text>
<text x="790" y="231" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#e8eef6" font-weight="400" text-anchor="start" xml:space="preserve">(optional in the POC)</text>
<rect x="1110" y="200" width="80.75999999999999" height="26" rx="13.0" fill="#4aa8e822" stroke="#4aa8e8"/>
<text x="1150.38" y="217" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#4aa8e8" font-weight="600" text-anchor="middle" xml:space="preserve">visible</text>
<rect x="30" y="291" width="1280" height="72" rx="10" fill="#ff7a6612" stroke="#ff7a66" stroke-width="1.2"/>
<text x="46" y="334" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#e8eef6" font-weight="600" text-anchor="start" xml:space="preserve">Same server via its original URL</text>
<text x="420" y="333" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#a9b8ca" font-weight="400" text-anchor="start" xml:space="preserve">mcp.glygen.org/mcp</text>
<text x="790" y="322" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#e8eef6" font-weight="400" text-anchor="start" xml:space="preserve">nothing; only the team&#x27;s</text>
<text x="790" y="345" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#e8eef6" font-weight="400" text-anchor="start" xml:space="preserve">own server logs</text>
<rect x="1110" y="314" width="115.48" height="26" rx="13.0" fill="#ff7a6622" stroke="#ff7a66"/>
<text x="1167.74" y="331" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#ff7a66" font-weight="600" text-anchor="middle" xml:space="preserve">not visible</text>
<rect x="30" y="375" width="1280" height="72" rx="10" fill="#ff7a6612" stroke="#ff7a66" stroke-width="1.2"/>
<text x="46" y="418" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#e8eef6" font-weight="600" text-anchor="start" xml:space="preserve">Local stdio install</text>
<text x="420" y="417" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#a9b8ca" font-weight="400" text-anchor="start" xml:space="preserve">uvx standards-explorer-mcp</text>
<text x="790" y="406" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#e8eef6" font-weight="400" text-anchor="start" xml:space="preserve">no calls; package</text>
<text x="790" y="429" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#e8eef6" font-weight="400" text-anchor="start" xml:space="preserve">downloads as a floor</text>
<rect x="1110" y="398" width="141.51999999999998" height="26" rx="13.0" fill="#f2b44122" stroke="#f2b441"/>
<text x="1180.76" y="415" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#f2b441" font-weight="600" text-anchor="middle" xml:space="preserve">downloads only</text>
<rect x="30" y="459" width="1280" height="72" rx="10" fill="#ff7a6612" stroke="#ff7a66" stroke-width="1.2"/>
<text x="46" y="502" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#e8eef6" font-weight="600" text-anchor="start" xml:space="preserve">Third-party wrapper (GTEx, Enrichr)</text>
<text x="420" y="501" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#a9b8ca" font-weight="400" text-anchor="start" xml:space="preserve">@pipeworx/mcp-gtex, enrichr-mcp</text>
<text x="790" y="490" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#e8eef6" font-weight="400" text-anchor="start" xml:space="preserve">no calls; they hit DCC APIs</text>
<text x="790" y="513" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#e8eef6" font-weight="400" text-anchor="start" xml:space="preserve">directly. Downloads only</text>
