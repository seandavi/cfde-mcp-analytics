<rect x="340.5" y="563" width="24" height="16" rx="4" fill="#f2b4411a" stroke="#f2b441" stroke-width="2"/>
<text x="374.5" y="576" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#e8eef6" font-weight="400" text-anchor="start" xml:space="preserve">Download counts only (a floor)</text>
